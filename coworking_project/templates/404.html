<!-- templates/404.html -->

{% extends "base.html" %}

{% block title %}Page non trouvée{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-10rem)]">
    <div class="fade-in w-full max-w-xl p-8 text-center bg-white rounded-xl shadow-lg">
        
        <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-yellow-100">
            <!-- Icône de recherche / interrogation -->
            <i class="fas fa-question-circle fa-3x text-yellow-500"></i>
        </div>

        <h1 class="mt-6 text-5xl font-extrabold text-gray-800">404</h1>
        <h2 class="mt-2 text-3xl font-bold text-gray-800">Page Non Trouvée</h2>
        
        <p class="mt-4 text-gray-600">
            Oups ! La page que vous recherchez semble s'être égarée dans le cyberespace.
        </p>
        
        <div class="mt-8">
            <a href="{% url 'home' %}" 
               class="inline-block px-8 py-3 border border-transparent rounded-lg shadow-sm text-lg font-medium text-white bg-blue-600
                      hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition">
                Retourner à l'accueil
            </a>
        </div>
        
    </div>
</div>
{% endblock %}
