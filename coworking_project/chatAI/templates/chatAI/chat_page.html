{% extends "base.html" %}

{% block title %}Assistant IA{% endblock %}

{% block content %}
<div class="fade-in flex flex-col h-[calc(100vh-10rem)] bg-white rounded-xl shadow-2xl">

    <!-- En-tête du Chat -->
    <div class="flex-shrink-0 p-4 border-b flex items-center justify-between bg-gray-50 rounded-t-xl">
        <div class="flex items-center">
            <div class="relative">
                <i class="fas fa-robot fa-2x text-blue-500"></i>
                <span class="absolute -top-1 -right-1 flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                </span>
            </div>
            <div class="ml-4">
                <h1 class="text-lg font-bold text-gray-800">Assistant IA</h1>
                <p class="text-xs text-green-600">En ligne</p>
            </div>
        </div>
        <button id="clear-chat-btn" class="text-gray-400 hover:text-red-500 transition" title="Nouvelle conversation">
            <i class="fas fa-eraser"></i>
        </button>
    </div>

    <!-- Zone des Messages -->
    <div id="chat-box" class="flex-grow p-6 overflow-y-auto space-y-6">
        <div class="message ai-message">
            <div class="flex items-start gap-3">
                <i class="fas fa-robot flex-shrink-0 text-white bg-blue-500 p-2 rounded-full"></i>
                <div class="p-3 rounded-lg bg-gray-100 max-w-lg">
                    Bonjour {% if user.is_authenticated %}{{ user.first_name }}{% else %}visiteur{% endif %} !
                    Comment puis-je vous assister aujourd'hui ?
                </div>
            </div>
        </div>
    </div>

    <!-- Zone de Saisie -->
    <div class="flex-shrink-0 p-4 border-t bg-gray-50 rounded-b-xl">
        <div id="input-area" class="relative">
            <input type="text" id="user-input" placeholder="Posez votre question ici..."
                   class="w-full pl-4 pr-12 py-3 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="send-btn" class="absolute inset-y-0 right-0 flex items-center justify-center w-12 text-blue-500 hover:text-blue-700">
                <i class="fas fa-paper-plane fa-lg"></i>
            </button>
        </div>
    </div>
</div>
{% endblock %}


{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const clearBtn = document.getElementById('clear-chat-btn');
        const chatApiUrl = "{% url 'chat_api' %}";

        // Fonction pour ajouter un message à l'interface
        function addMessage(message, sender, isLoading = false) {
            const messageWrapper = document.createElement('div');
            messageWrapper.classList.add('message', sender === 'user' ? 'user-message' : 'ai-message');
            
            let messageHtml = '';
            const sanitizedMessage = message.replace(/</g, "<").replace(/>/g, ">");

            if (sender === 'user') {
                messageHtml = `
                    <div class="flex items-start gap-3 justify-end">
                        <div class="p-3 rounded-lg bg-blue-500 text-white max-w-lg">
                            ${sanitizedMessage}
                        </div>
                        <i class="fas fa-user-circle flex-shrink-0 text-gray-400 p-2 rounded-full bg-gray-100"></i>
                    </div>`;
            } else {
                let loadingIndicator = '';
                if (isLoading) {
                    loadingIndicator = `
                        <div class="dot-flashing"></div>
                        <div class="dot-flashing"></div>
                        <div class="dot-flashing"></div>
                    `;
                }
                messageHtml = `
                    <div class="flex items-start gap-3">
                        <i class="fas fa-robot flex-shrink-0 text-white bg-blue-500 p-2 rounded-full"></i>
                        <div class="ai-response-bubble p-3 rounded-lg bg-gray-100 max-w-lg">
                            ${isLoading ? loadingIndicator : sanitizedMessage}
                        </div>
                    </div>`;
            }

            messageWrapper.innerHTML = messageHtml;
            chatBox.appendChild(messageWrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
            return messageWrapper; // On retourne l'élément pour le modifier plus tard
        }
        
        // Fonction pour envoyer le message
        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            userInput.value = '';
            userInput.focus();
            
            // Affiche un indicateur de chargement
            const loadingBubble = addMessage('', 'ai', true);
            
            try {
                const response = await fetch(chatApiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                let aiResponse = "Désolé, une erreur est survenue.";

                if (response.ok) {
                    aiResponse = data.response;
                } else {
                    aiResponse = data.error || aiResponse;
                }

                // Remplace l'indicateur de chargement par la vraie réponse
                const responseBubbleContent = loadingBubble.querySelector('.ai-response-bubble');
                responseBubbleContent.innerHTML = aiResponse.replace(/</g, "<").replace(/>/g, ">");

            } catch (error) {
                console.error('Erreur:', error);
                const responseBubbleContent = loadingBubble.querySelector('.ai-response-bubble');
                responseBubbleContent.textContent = "Désolé, impossible de joindre l'assistant.";
            } finally {
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        // Fonction pour réinitialiser la conversation
        function clearChat() {
            // Ici, on pourrait appeler une API pour vider la session côté serveur
            // Pour l'instant, on rafraîchit simplement la page.
            window.location.reload();
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
        clearBtn.addEventListener('click', clearChat);
    });
</script>

<style>
/* CSS supplémentaire pour l'animation de frappe */
.dot-flashing {
  position: relative;
  width: 5px; height: 5px;
  border-radius: 5px;
  background-color: #9880ff;
  color: #9880ff;
  animation: dot-flashing 1s infinite linear alternate;
  animation-delay: 0.5s;
  display: inline-block;
  margin: 0 2px;
}
.dot-flashing::before, .dot-flashing::after {
  content: "";
  display: inline-block;
  position: absolute;
  top: 0;
}
.dot-flashing::before {
  left: -10px;
  width: 5px; height: 5px;
  border-radius: 5px;
  background-color: #9880ff;
  color: #9880ff;
  animation: dot-flashing 1s infinite alternate;
  animation-delay: 0s;
}
.dot-flashing::after {
  left: 10px;
  width: 5px; height: 5px;
  border-radius: 5px;
  background-color: #9880ff;
  color: #9880ff;
  animation: dot-flashing 1s infinite alternate;
  animation-delay: 1s;
}
@keyframes dot-flashing {
  0% { background-color: #9880ff; }
  50%, 100% { background-color: #c5bcf5; }
}
</style>
{% endblock %}
